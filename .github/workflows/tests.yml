name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: MeadowPy

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            MeadowPy/meadowpy/requirements.txt
            MeadowPy/dev/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r dev/requirements-dev.txt

      - name: Run test suite
        run: >
          python -m pytest
          -c dev/pytest.ini
          --cov-report=html:dev/htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows-python-3.11
          path: |
            MeadowPy/dev/coverage.xml
            MeadowPy/dev/htmlcov/
          if-no-files-found: warn
          retention-days: 14
