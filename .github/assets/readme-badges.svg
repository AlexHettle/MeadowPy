<svg xmlns="http://www.w3.org/2000/svg" width="359" height="44" viewBox="0 0 359 44" role="img" aria-labelledby="title desc">
  <title id="title">MeadowPy project badges</title>
  <desc id="desc">Python 3.11 or newer, Windows 10 and 11, MIT License, AI powered by Ollama, active development, and 95 percent test coverage.</desc>
  <defs>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="python-clip"><rect width="109" height="20" rx="3"/></clipPath>
    <clipPath id="platform-clip"><rect width="152" height="20" rx="3"/></clipPath>
    <clipPath id="license-clip"><rect width="82" height="20" rx="3"/></clipPath>
    <clipPath id="ai-clip"><rect width="72" height="20" rx="3"/></clipPath>
    <clipPath id="status-clip"><rect width="166" height="20" rx="3"/></clipPath>
    <clipPath id="coverage-clip"><rect width="98" height="20" rx="3"/></clipPath>
  </defs>

  <g transform="translate(0 0)">
    <g clip-path="url(#python-clip)">
      <rect width="66" height="20" fill="#555"/>
      <rect x="66" width="43" height="20" fill="#007ec6"/>
      <rect width="109" height="20" fill="url(#shine)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <image x="5" y="3" width="14" height="14" href="data:image/svg+xml;base64,"/>
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="425" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="390">Python</text><text x="425" y="150" fill-opacity=".3" textLength="390">Python</text></g>
        <text x="425" y="140" textLength="390">Python</text>
      </g>
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="865" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="330">3.11+</text><text x="865" y="150" fill-opacity=".3" textLength="330">3.11+</text></g>
        <text x="865" y="140" textLength="330">3.11+</text>
      </g>
    </g>
  </g>

  <g transform="translate(117 0)">
    <g clip-path="url(#platform-clip)">
      <rect width="57" height="20" fill="#555"/>
      <rect x="57" width="95" height="20" fill="#0078d4"/>
      <rect width="152" height="20" fill="url(#shine)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="295" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="470">Platform</text><text x="295" y="150" fill-opacity=".3" textLength="470">Platform</text></g>
        <text x="295" y="140" textLength="470">Platform</text>
      </g>
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="1035" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="850">Windows 10/11</text><text x="1035" y="150" fill-opacity=".3" textLength="850">Windows 10/11</text></g>
        <text x="1035" y="140" textLength="850">Windows 10/11</text>
      </g>
    </g>
  </g>

  <g transform="translate(277 0)">
    <g clip-path="url(#license-clip)">
      <rect width="51" height="20" fill="#555"/>
      <rect x="51" width="31" height="20" fill="#67ac09"/>
      <rect width="82" height="20" fill="url(#shine)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="265" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="410">License</text><text x="265" y="150" fill-opacity=".3" textLength="410">License</text></g>
        <text x="265" y="140" textLength="410">License</text>
      </g>
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="655" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="210">MIT</text><text x="655" y="150" fill-opacity=".3" textLength="210">MIT</text></g>
        <text x="655" y="140" textLength="210">MIT</text>
      </g>
    </g>
  </g>

  <g transform="translate(4 24)">
    <g clip-path="url(#ai-clip)">
      <rect width="23" height="20" fill="#555"/>
      <rect x="23" width="49" height="20" fill="#ea7233"/>
      <rect width="72" height="20" fill="url(#shine)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="125" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="130">AI</text><text x="125" y="150" fill-opacity=".3" textLength="130">AI</text></g>
        <text x="125" y="140" textLength="130">AI</text>
      </g>
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="465" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="390">Ollama</text><text x="465" y="150" fill-opacity=".3" textLength="390">Ollama</text></g>
        <text x="465" y="140" textLength="390">Ollama</text>
      </g>
    </g>
  </g>

  <g transform="translate(84 24)">
    <g clip-path="url(#status-clip)">
      <rect width="45" height="20" fill="#555"/>
      <rect x="45" width="121" height="20" fill="#4b0"/>
      <rect width="166" height="20" fill="url(#shine)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="235" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="350">Status</text><text x="235" y="150" fill-opacity=".3" textLength="350">Status</text></g>
        <text x="235" y="140" textLength="350">Status</text>
      </g>
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="1045" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="1110">Active Development</text><text x="1045" y="150" fill-opacity=".3" textLength="1110">Active Development</text></g>
        <text x="1045" y="140" textLength="1110">Active Development</text>
      </g>
    </g>
  </g>

  <g transform="translate(258 24)">
    <g clip-path="url(#coverage-clip)">
      <rect width="63" height="20" fill="#555"/>
      <rect x="63" width="35" height="20" fill="#4b0"/>
      <rect width="98" height="20" fill="url(#shine)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="325" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="530">Coverage</text><text x="325" y="150" fill-opacity=".3" textLength="530">Coverage</text></g>
        <text x="325" y="140" textLength="530">Coverage</text>
      </g>
      <g transform="scale(.1)">
        <g aria-hidden="true" fill="#010101"><text x="795" y="150" fill-opacity=".8" filter="url(#shadow)" textLength="250">95%</text><text x="795" y="150" fill-opacity=".3" textLength="250">95%</text></g>
        <text x="795" y="140" textLength="250">95%</text>
      </g>
    </g>
  </g>
</svg>
